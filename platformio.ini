[env:esp32-cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_type = release

; OTA needs two app slots. WiFi + TLS makes the firmware too big for the
; default 1.25 MB slots, so use min_spiffs (2 x 1.9 MB app, 128 KB LittleFS).
; Changing the partition table requires ONE normal USB upload; OTA cannot do it.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

; LVGL 8.3.11 is bundled in lib/lvgl (copied from the known-good build), so it
; is intentionally NOT listed here. Do not add "lvgl/lvgl" back or PlatformIO
; will download a second copy and the two will conflict.
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    mikalhart/TinyGPSPlus @ ^1.0.3

build_flags =
    -D USER_SETUP_LOADED=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -I lib/lvgl/src
    -I lib/lvgl/src/widgets
    -D LV_CONF_PATH="lv_conf.h"
    -include include/User_Setup_CYD.h